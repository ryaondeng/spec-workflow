[project]
name = "spec-workflow"
version = "0.1.0"
description = "Spec 驱动开发工作流（编排引擎 + 质量门禁 + skills 分发）"
# 开发环境统一 Python 3.12（uv 托管；见 README「开发环境」）
requires-python = ">=3.12"
# dev-docs v1.5：tree-sitter 为运行时硬依赖（全语言统一抽取；见 docs/next/方案-tree-sitter适配器架构.md）
dependencies = [
  "tree-sitter>=0.26",
  "tree-sitter-python>=0.23",
  "tree-sitter-cpp>=0.23",
  "tree-sitter-c>=0.23",
  "tree-sitter-java>=0.23",
  "tree-sitter-javascript>=0.25",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-bash>=0.25",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests", "skills/dev-docs/tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["__pycache__", ".venv", "docs"]

[tool.ruff.lint]
# E/W = pycodestyle（样式与可疑写法）、F = pyflakes（未用导入/未定义名等真实缺陷）
select = ["E", "W", "F"]

[tool.uv]
# 本仓库不打包发布（分发走 install.py 拷贝 skills/），避免 uv 尝试构建工程
package = false
